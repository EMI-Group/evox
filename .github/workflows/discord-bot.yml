# Announce GitHub releases in the Discord `#changelog` channel.
#
# `release: published` fires for stable releases AND for pre-releases, so the
# experimental 2.0 pre-releases (e.g. `v2.0.0a1`) are announced too — the
# release body is the changelog, so it should say "experimental pre-release".
# The avatar/footer images point at the brand assets in this repo
# (`docs/source/_static/evox_logo_light.svg`), which still exist on `main`.
name: Github Releases To Discord
on:
  release:
    types: [published]
jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Github Releases To Discord
        uses: SethCohen/github-releases-to-discord@v1.16.2
        with:
          webhook_url: ${{ secrets.DISCORD_BOT_WEBHOOK }}
          color: "2105893"
          username: "Release Changelog"
          avatar_url: "https://raw.githubusercontent.com/EMI-Group/evox/refs/heads/main/docs/source/_static/evox_logo_light.svg"
          content: "||@everyone||"
          footer_title: "Changelog"
          footer_icon_url: "https://raw.githubusercontent.com/EMI-Group/evox/refs/heads/main/docs/source/_static/evox_logo_light.svg"
          footer_timestamp: true
          max_description: '4096'
          reduce_headings: true
